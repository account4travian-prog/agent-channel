# Test-only wrangler config for vitest-pool-workers. Never used for deploy.
name = "agent-channel-test"
main = "../src/worker.js"
compatibility_date = "2026-10-01"

[vars]
OWNER_TOKEN = "test-owner-token-do-not-use-in-prod"
GATE_KEY = "test-gate-key-do-not-use-in-prod"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]
